<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="Dhanyas Boutique">
  <title>Dhanyas Boutique</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#5C1450"/>
      <stop offset="55%" stop-color="#40092F"/>
      <stop offset="100%" stop-color="#24041B"/>
    </radialGradient>

    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBEFC2"/>
      <stop offset="28%" stop-color="#E8C877"/>
      <stop offset="55%" stop-color="#C99B3E"/>
      <stop offset="78%" stop-color="#EBD08A"/>
      <stop offset="100%" stop-color="#B8862B"/>
    </linearGradient>

    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9B6C8"/>
      <stop offset="50%" stop-color="#B84A86"/>
      <stop offset="100%" stop-color="#7E2A5C"/>
    </linearGradient>
  </defs>

  <!-- backdrop -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- gold rings -->
  <circle cx="512" cy="500" r="466" fill="none" stroke="url(#gold)" stroke-width="13"/>
  <circle cx="512" cy="500" r="446" fill="none" stroke="url(#gold)" stroke-width="3.5" opacity="0.75"/>

  <!-- monogram D -->
  <text x="512" y="640" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Playfair Display', serif"
        font-size="600" font-weight="700" fill="url(#gold)">D</text>

  <!-- sari-clad woman monogram -->
  <g transform="translate(512 452) scale(0.86)">
    <circle cx="-26" cy="-150" r="26" fill="url(#gold)"/>
    <g transform="translate(-44 -170)" fill="url(#rose)">
      <circle cx="0" cy="-11" r="8"/>
      <circle cx="10" cy="-4" r="8"/>
      <circle cx="6" cy="9" r="8"/>
      <circle cx="-6" cy="9" r="8"/>
      <circle cx="-10" cy="-4" r="8"/>
      <circle cx="0" cy="0" r="5" fill="#FBEFC2"/>
    </g>
    <path d="M -18 -172 C -44 -172 -60 -152 -60 -128 C -60 -112 -54 -100 -44 -92
             L -50 -80 C -30 -70 -2 -72 12 -84 C 22 -92 26 -104 22 -120
             L 16 -144 C 10 -162 -2 -172 -18 -172 Z" fill="url(#gold)"/>
    <circle cx="-18" cy="-92" r="7" fill="url(#rose)"/>
    <path d="M -58 -70 C -108 -44 -128 16 -122 74 C -117 124 -134 158 -152 200
             L 150 200 C 132 158 116 124 121 74 C 127 16 106 -44 58 -70
             C 30 -88 -30 -88 -58 -70 Z" fill="url(#gold)"/>
    <path d="M -54 -64 C -122 0 -150 84 -142 140 C -138 168 -146 186 -154 200
             L -46 200 C -50 128 -44 44 -14 -44 Z" fill="url(#rose)" opacity="0.95"/>
    <path d="M -12 -80 C 14 -80 32 -66 40 -44 L 26 66 L -30 66 L -44 -44
             C -36 -66 -24 -80 -12 -80 Z" fill="#3B0A2C" opacity="0.55"/>
    <path d="M 48 -52 C 76 -26 90 16 86 54" fill="none" stroke="url(#gold)"
          stroke-width="17" stroke-linecap="round"/>
    <circle cx="86" cy="56" r="9" fill="none" stroke="#FBEFC2" stroke-width="5"/>
  </g>

  <!-- lotus accent beside the monogram -->
  <g transform="translate(742 520)" fill="url(#rose)" stroke="url(#gold)" stroke-width="5">
    <path d="M 0 0 C 34 -26 52 -66 44 -100 C 20 -78 6 -44 0 0 Z"/>
    <path d="M 0 0 C -30 -20 -46 -54 -40 -84 C -14 -66 -2 -34 0 0 Z" opacity="0.85"/>
  </g>

  <!-- wordmark -->
  <text x="512" y="762" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', 'Playfair Display', serif"
        font-size="86" font-weight="700" fill="url(#gold)">Dhanyasboutique</text>

  <!-- underline flourish -->
  <path d="M 232 806 C 372 826 652 826 792 806" fill="none" stroke="url(#gold)"
        stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <!-- divider + lotus -->
  <line x1="300" y1="862" x2="452" y2="862" stroke="url(#gold)" stroke-width="3.5"/>
  <line x1="572" y1="862" x2="724" y2="862" stroke="url(#gold)" stroke-width="3.5"/>
  <g transform="translate(512 862)" fill="url(#rose)" stroke="url(#gold)" stroke-width="4">
    <path d="M 0 0 C 20 -14 28 -34 24 -52 C 8 -42 2 -22 0 0 Z"/>
    <path d="M 0 0 C -20 -14 -28 -34 -24 -52 C -8 -42 -2 -22 0 0 Z"/>
  </g>

  <!-- tagline -->
  <text x="512" y="922" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="27" letter-spacing="9" fill="#E8C877">FASHION • STYLE • YOU</text>
</svg>
